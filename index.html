<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 3D shelf of CDs, cassettes and records. Scroll, spin and play your own music with its cover art.">
<meta name="theme-color" content="#ebebe8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23151514'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ebebe8'/%3E%3C/svg%3E">
<title>Halftone Listening Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Single light look by design (a lit studio counter), same in every theme.
   Layout: full-bleed WebGL shelf on a dot-grid counter; HUD pinned to corners (title top-left, counter top-right, dock bottom). 4px grid. */
:root{
  --bg:#ebebe8; --dot:#c8c8c2; --ink:#151514; --ink-2:#4a4a46; --muted:#77776f; --line:rgba(20,20,18,.09);
  --surface:#f6f6f3; --pill:#151514; --pill-ink:#f4f4f1; --accent:#d2342b; --lcd:#0f110f;
  --r-ctl:10px; --r-panel:14px; color-scheme:light;
  --ease:cubic-bezier(.2,.7,.2,1);
  --f-pix:"Doto","VT323","Courier New",monospace;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-body:"Inter",system-ui,-apple-system,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:16px 16px;
  -webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.grabbing{cursor:grabbing}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}

.hud{position:fixed;inset:0;pointer-events:none;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.01em}
.panel{background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}

.info{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:calc(24px + env(safe-area-inset-top,0px));display:grid;gap:16px;max-width:min(440px,70vw);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.kicker{color:var(--muted);display:flex;gap:8px;align-items:center}
.kicker b{color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
h1.pix{margin:0;font-family:var(--f-pix);font-weight:700;font-size:clamp(36px,5.4vw,72px);line-height:.92;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.card{border-radius:var(--r-panel);padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:8px 24px;width:max-content;max-width:100%;margin:0}
.card dt{color:var(--muted)} .card dd{margin:0;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}

.counter{position:absolute;right:max(24px,env(safe-area-inset-right,0px));top:calc(24px + env(safe-area-inset-top,0px));text-align:right;display:grid;gap:4px}
.counter b{font-family:var(--f-pix);font-weight:700;font-size:clamp(32px,3.6vw,48px);line-height:1;font-variant-numeric:tabular-nums}
.counter span{color:var(--muted)}

.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;transition:opacity .45s var(--ease),transform .45s var(--ease);width:max-content;max-width:calc(100vw - 32px)}
.bar4{display:flex;align-items:center;gap:4px;border-radius:calc(var(--r-ctl) + 4px);padding:4px}
.ib{appearance:none;border:0;background:transparent;color:var(--ink-2);width:32px;height:32px;border-radius:var(--r-ctl);display:grid;place-items:center;cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease)}
.ib:hover{background:var(--line);color:var(--ink)}
.ib:active{transform:scale(.96)}
.ib:focus-visible,.pip:focus-visible,.back:focus-visible,.trk:focus-visible,.bar4 button:focus-visible,.fmtsw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pips{display:flex;gap:4px;padding:0 4px}
.pip{appearance:none;border:0;cursor:pointer;height:24px;min-width:28px;border-radius:6px;background:transparent;color:var(--muted);font:500 11px var(--f-mono);font-variant-numeric:tabular-nums;padding:0 4px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.pip:hover{color:var(--ink)}
.pip.on{background:var(--pill);color:var(--pill-ink)}
.hint{color:var(--muted)}

/* cursor badge + spin ring */
.cur{position:fixed;left:0;top:0;pointer-events:none;z-index:5;background:var(--pill);color:var(--pill-ink);border-radius:8px;padding:4px 8px;font:500 11px var(--f-mono);white-space:nowrap;opacity:0;transition:opacity .15s var(--ease)}
.cur.show{opacity:1}
.ring{position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;border:1.5px dashed var(--ink);opacity:0;transition:opacity .25s var(--ease);z-index:4}
.ring.show{opacity:.4}

/* play mode */
.back{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:calc(24px + env(safe-area-inset-top,0px));appearance:none;color:var(--ink);border-radius:var(--r-ctl);padding:8px 12px 8px 8px;cursor:pointer;display:flex;gap:8px;align-items:center;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .4s var(--ease),transform .4s var(--ease),background-color .15s var(--ease)}
.back:hover{background:var(--bg)}
.tracks{position:absolute;right:max(24px,env(safe-area-inset-right,0px));top:50%;transform:translate(16px,-50%);width:256px;border-radius:var(--r-panel);padding:16px;display:grid;gap:12px;opacity:0;pointer-events:none;transition:opacity .45s .15s var(--ease),transform .45s .15s var(--ease)}
.tracks .fm{color:var(--muted)}
.tracks h2{margin:0;font-family:var(--f-pix);font-weight:700;font-size:24px;line-height:1;text-transform:uppercase;text-wrap:balance}
.tracks ol{list-style:none;margin:0 -8px;padding:0;display:grid;gap:0}
.trk{appearance:none;border:0;background:transparent;color:var(--ink-2);width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;text-align:left;padding:8px;border-radius:8px;cursor:pointer;font:400 13px var(--f-body);transition:background-color .15s var(--ease)}
.trk:hover{background:var(--line)}
.trk .n,.trk .d{font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.trk.on{color:var(--ink);font-weight:500} .trk.on .n{color:var(--accent)}
.liner{color:var(--muted);font-size:12px;line-height:1.5;margin:0}

.now{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);width:min(560px,calc(100vw - 32px));border-radius:var(--r-panel);padding:8px 12px 8px 8px;display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity .45s .2s var(--ease),transform .45s .2s var(--ease)}
.ctrls{display:flex;gap:4px;align-items:center}
.ctrls .play{background:var(--pill);color:var(--pill-ink);width:36px;height:36px}
.ctrls .play:hover{background:var(--pill);color:var(--pill-ink);opacity:.88}
.thumb{width:36px;height:36px;border-radius:6px;background:var(--line) center/cover}
.meta{min-width:0;display:grid;gap:8px}
.meta .t{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;cursor:pointer}
.prog i{display:block;height:100%;width:0;background:var(--ink)}
.time{font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}

body.playing-mode .info,body.playing-mode .counter{opacity:0;transform:translateY(-8px);pointer-events:none}
body.playing-mode .dock{opacity:0;transform:translate(-50%,16px);pointer-events:none}
body.playing-mode .back{opacity:1;transform:none;pointer-events:auto}
body.playing-mode .tracks{opacity:1;transform:translate(0,-50%);pointer-events:auto}
body.playing-mode .now{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* loader */
.loader{position:fixed;inset:0;z-index:20;background:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:16px 16px;display:grid;place-items:center;transition:opacity .7s .1s var(--ease),visibility .7s .1s}
.loader.done{opacity:0;visibility:hidden}
.ld{display:grid;gap:12px;justify-items:center}
.ld b{font-family:var(--f-pix);font-weight:700;font-size:clamp(64px,12vw,140px);line-height:.9;font-variant-numeric:tabular-nums}
.ld .bar{width:180px;height:2px;background:var(--line)} .ld .bar i{display:block;height:100%;width:0;background:var(--ink)}
.ld span{color:var(--muted)}

/* add music */
.bar4 .pick,.bar4 #clearBtn{appearance:none;border:0;cursor:pointer;border-radius:var(--r-ctl);padding:8px 12px;background:transparent;color:var(--ink-2);font:inherit;letter-spacing:inherit;transition:background-color .15s var(--ease),color .15s var(--ease)}
.bar4 .pick:hover,.bar4 #clearBtn:hover{background:var(--line);color:var(--ink)}
/* the real file input covers the button, so the tap lands on it directly */
.pick{position:relative;overflow:hidden;display:inline-flex;gap:8px;align-items:center}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.bar4 .main{background:var(--pill);color:var(--pill-ink);padding-left:8px}
.bar4 .main:hover{background:var(--pill);color:var(--pill-ink);opacity:.88}
.fmtsw{display:flex;gap:4px;width:max-content;border-radius:var(--r-ctl);padding:4px}
.fmtsw button{appearance:none;border:0;cursor:pointer;background:transparent;color:var(--muted);border-radius:6px;padding:4px 12px;font:inherit;letter-spacing:inherit;transition:background-color .15s var(--ease),color .15s var(--ease)}
.fmtsw button:hover{color:var(--ink)}
.fmtsw button.on{background:var(--pill);color:var(--pill-ink)}
.drop{position:fixed;inset:12px;z-index:15;border:1.5px dashed var(--ink);border-radius:20px;background:var(--bg);opacity:.96;display:grid;place-items:center;text-align:center;pointer-events:none}
.drop div{display:grid;gap:12px;padding:16px}
.drop b{font-family:var(--f-pix);font-weight:700;font-size:clamp(36px,7vw,84px);line-height:.9}
.drop span{color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(24px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:16;background:var(--pill);color:var(--pill-ink);border-radius:var(--r-ctl);padding:8px 16px;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:760px){
  .tracks{display:none}
  .hint{display:none}
  .info{max-width:calc(100vw - 120px);gap:12px}
  .counter .sfx{display:none}
  .pips{gap:2px;padding:0 2px}
  .pip{min-width:24px;padding:0 2px}
  .ib{width:28px}
  h1.pix{font-size:clamp(32px,10vw,44px)}
  .card{grid-template-columns:auto auto;font-size:10px;padding:8px 12px;gap:4px 16px}
  .now{grid-template-columns:auto 1fr auto}
  .now .thumb{display:none}
}
@media (max-height:560px){ .card{display:none} }
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01s!important} }
</style>
</head>
<body>

<canvas id="gl" aria-label="3D shelf of CDs, cassettes and records"></canvas>

<div class="loader" id="loader"><div class="ld"><b id="ldNum">000</b><div class="bar"><i id="ldBar"></i></div><span class="mono">Warming up the room</span></div></div>

<div class="hud">
  <section class="info" aria-live="polite">
    <div class="kicker mono"><b id="kIdx">01</b><span>—</span><span id="kFmt">Compact disc</span></div>
    <h1 class="pix" id="title">Paper Satellites</h1>
    <dl class="card panel mono">
      <dt>Artist</dt><dd id="dArtist">—</dd>
      <dt>Year</dt><dd id="dYear">—</dd>
      <dt>Format</dt><dd id="dFormat">—</dd>
      <dt>Tracks</dt><dd id="dTracks">—</dd>
    </dl>
    <div class="fmtsw panel mono" role="group" aria-label="Show this album as">
      <button data-k="cd">CD</button><button data-k="tape">Tape</button><button data-k="vinyl">Vinyl</button>
    </div>
  </section>

  <div class="counter"><b id="count">01</b><span class="mono" id="countOf">of 09 · the shelf</span></div>

  <nav class="dock" aria-label="Shelf navigation">
    <div class="bar4 panel mono">
      <label class="pick main" id="addBtn"><span data-i="plus"></span>Add your music<input type="file" id="fileIn" multiple aria-label="Choose music files"></label>
      <label class="pick folder" id="addDir">Folder<input type="file" id="dirIn" webkitdirectory multiple aria-label="Choose a music folder"></label>
      <button id="clearBtn" hidden>Reset</button>
    </div>
    <div class="bar4 panel">
      <button class="ib" id="prev" aria-label="Previous album"><span data-i="left"></span></button>
      <div class="pips" id="pips"></div>
      <button class="ib" id="next" aria-label="Next album"><span data-i="right"></span></button>
    </div>
    <span class="hint mono">Scroll to browse · drag to spin · click to play</span>
  </nav>

  <button class="back panel mono" id="back"><span data-i="back"></span>Back to shelf</button>

  <aside class="tracks panel" aria-label="Tracklist">
    <div class="mono fm" id="tFmt">Side A</div>
    <h2 id="tTitle">—</h2>
    <ol id="tList"></ol>
    <p class="liner" id="tLiner"></p>
  </aside>

  <div class="now panel" role="group" aria-label="Player">
    <div class="ctrls">
      <button class="ib" id="pPrev" aria-label="Previous track"><span data-i="prev"></span></button>
      <button class="ib play" id="pPlay" aria-label="Pause"></button>
      <button class="ib" id="pNext" aria-label="Next track"><span data-i="next"></span></button>
    </div>
    <div class="thumb" id="pThumb"></div>
    <div class="meta"><div class="t" id="pTitle">—</div><div class="prog" id="pProg"><i id="pBar"></i></div></div>
    <div class="ctrls"><span class="time" id="pTime">0:00</span><button class="ib" id="pMute" aria-label="Mute"></button></div>
  </div>
</div>

<div class="drop" id="drop" hidden><div><b>Drop to shelve</b><span class="mono">MP3, M4A, FLAC, OGG or WAV. Whole folders work too</span><span class="mono">Cover art is read from the files</span></div></div>
<div class="toast mono" id="toast" role="status" hidden></div>

<div class="cur" id="cur">View</div>
<div class="ring" id="ring"></div>

<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- data ---------------- */
const DEMO = [
 {kind:'cd',   title:'Paper Satellites', artist:'Ines Calloway', year:2003, art:'aurora',  pal:['#5aa8ff','#ff5fa2','#ffcf3a','#2fc493','#b9cdfa'], root:57, minor:false,
  liner:'Recorded on a borrowed four-track in a loft above a bicycle shop.', tracks:[['Low Orbit',214],['Kite String',187],['Window Seat',241],['Static Bloom',199],['Last Bus Home',263]]},
 {kind:'tape', title:'Overpass Hours', artist:'Teodor & Vale', year:1989, art:'stripes', pal:['#f1e7d6','#e5392f','#2e3a8c','#f2b53a','#151514'], shell:'#2a2a2c', root:52, minor:true,
  liner:'A C60 dubbed twice. Side B has a radio bleed at 14:02.', tracks:[['Sodium Lamps',201],['Ring Road',236],['Late Shift',178],['Exit 9',254]]},
 {kind:'vinyl',title:'Quiet Machinery', artist:'The Lantern Club', year:1976, art:'sunburst',pal:['#f4c542','#e86a2b','#fbeed2','#1d2b4f'], root:55, minor:false,
  liner:'Cut at 33⅓ on a lathe that ran slightly fast. Nobody fixed it.', tracks:[['Gears in Spring',245],['Tin Choir',212],['Slow Conveyor',288],['Lamp Oil',196],['Night Foreman',231]]},
 {kind:'cd',   title:'Citrus Static', artist:'Yuki Arden', year:2001, art:'halftone',pal:['#ff7a1a','#fff2df','#1d1d1b','#ffc94d'], root:60, minor:false,
  liner:'Thirteen minutes of pop music with the treble all the way up.', tracks:[['Orange Dial',176],['Signal Peel',203],['Zest',158],['Pulp Fiction Radio',221]]},
 {kind:'tape', title:'Ferry Loop', artist:'Okon Ansa', year:1992, art:'waves', pal:['#0f5c8a','#7cc6de','#f4efe4','#f2a23a','#0b2236'], shell:'#e9e4d8', root:50, minor:true,
  liner:'Field recordings from the 6:40 crossing, layered with guitar.', tracks:[['Gangway',192],['Gulls on Tape',224],['Harbour Lights',247],['Return Fare',205]]},
 {kind:'vinyl',title:'Velvet Floor', artist:'Marisol Kade', year:1981, art:'moon', pal:['#141a33','#e9d8b4','#8f6bd6','#f26b8a'], root:53, minor:true,
  liner:'Played loud at the after-hours room on Calle Nueve until it warped.', tracks:[['Mirror Ball',236],['Coat Check',201],['4 A.M. Taxi',264],['Velvet Floor',298]]},
 {kind:'cd',   title:'Glasshouse FM', artist:'North Pier', year:2006, art:'grid', pal:['#2fbf71','#f5f5f0','#1f6fff','#ffd23f','#ff5d73'], root:62, minor:false,
  liner:'A pirate station that only broadcast on Sundays.', tracks:[['Greenhouse Effect',209],['Fern Signal',183],['Condensation',227],['Sunday Static',244]]},
 {kind:'tape', title:'Rooftop Demos', artist:'Sela Brandt', year:1995, art:'checker', pal:['#ff6fae','#ffe9f2','#3a2f8f','#ffd166'], shell:'#d8d6e8', root:58, minor:false,
  liner:'Four songs recorded on a Walkman between pigeon coops.', tracks:[['Antenna',172],['Tar Paper',198],['Water Tower',216],['Fire Escape',189]]},
 {kind:'vinyl',title:'Long Weekend', artist:'Harbor Choir', year:1979, art:'rings', pal:['#e7462c','#f3e3c3','#2b6a5e','#0f1f1c'], root:48, minor:false,
  liner:'Sixty voices, one microphone, a church with bad heating.', tracks:[['Friday Bells',251],['Low Tide Hymn',284],['Sunday Roast',203],['Monday Again',229]]},
];
let ALBUMS = DEMO;
let N = ALBUMS.length;
const FMT = {cd:'Compact disc', tape:'Cassette', vinyl:'12" vinyl'};
const fmtTime = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* ---------------- loader ---------------- */
const ldNum = document.getElementById('ldNum'), ldBar = document.getElementById('ldBar');
let ldShown = 0, ldTarget = 0;
(function ldTick(){ ldShown += (ldTarget - ldShown)*0.12; const v = Math.min(100, Math.round(ldShown));
  ldNum.textContent = String(v).padStart(3,'0'); ldBar.style.width = v+'%';
  if (v < 100) requestAnimationFrame(ldTick); else setTimeout(()=>document.getElementById('loader').classList.add('done'), 250); })();
ldTarget = 15;

await Promise.race([
  Promise.all(['700 40px Doto','600 40px Caveat','500 20px "JetBrains Mono"','700 20px "JetBrains Mono"'].map(f=>document.fonts.load(f))),
  new Promise(r=>setTimeout(r,2500))
]);
ldTarget = 40;

/* ---------------- procedural art ---------------- */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function grain(ctx,S,amt=18,seed=1){ const r=rng(seed); const img=ctx.getImageData(0,0,S,S); const d=img.data;
  for(let i=0;i<d.length;i+=4){ const n=(r()-.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } ctx.putImageData(img,0,0); }
function makeArt(a, i, S=1024){
  const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d'); const r=rng(i*977+13); const P=a.pal;
  if(a.cover){ // the album's own artwork, cropped to a square
    const w=a.cover.width, h=a.cover.height, m=Math.min(w,h);
    x.drawImage(a.cover,(w-m)/2,(h-m)/2,m,m,0,0,S,S); return c; }
  x.fillStyle=P[0]; x.fillRect(0,0,S,S);
  if(a.art==='aurora'){
    x.fillStyle=P[4]; x.fillRect(0,0,S,S); x.filter='blur(70px)';
    for(let k=0;k<11;k++){ x.fillStyle=P[k%4]; x.beginPath(); x.ellipse(r()*S,r()*S,140+r()*260,110+r()*220,r()*3,0,7); x.fill(); }
    x.filter='none';

const AUDIO_RE=/\.(mp3|m4a|aac|flac|ogg|oga|opus|wav|webm)$/i, IMG_RE=/\.(jpe?g|png|webp)$/i;
const PALS=[['#5aa8ff','#ff5fa2','#ffcf3a','#2fc493','#b9cdfa'],['#f1e7d6','#e5392f','#2e3a8c','#f2b53a','#151514'],['#f4c542','#e86a2b','#fbeed2','#1d2b4f'],['#0f5c8a','#7cc6de','#f4efe4','#f2a23a','#0b2236'],['#141a33','#e9d8b4','#8f6bd6','#f26b8a'],['#2fbf71','#f5f5f0','#1f6fff','#ffd23f','#ff5d73']];

const dirOf=f=>(f._path||f.webkitRelativePath||'').split('/').slice(0,-1).join('/');

function readTags(f){
  return Promise.race([ new Promise(res=>{ if(!window.jsmediatags) return res({});
    try{ window.jsmediatags.read(f,{onSuccess:t=>res(t.tags||{}),onError:()=>res({})}); }catch(e){ res({}); } }),
    new Promise(res=>setTimeout(()=>res({}),5000)) ]);
}
function readDuration(f){
  return new Promise(res=>{ const el=new Audio(); const u=URL.createObjectURL(f); let done=false;
    const fin=v=>{ if(done) return; done=true; URL.revokeObjectURL(u); el.removeAttribute('src'); res(isFinite(v)?v:0); };
    el.preload='metadata'; el.onloadedmetadata=()=>fin(el.duration); el.onerror=()=>fin(0); setTimeout(()=>fin(0),4000); el.src=u; });
}

  if(mode!=='shelf') leave();
  const dirCover={}; images.forEach(im=>{ const d=dirOf(im); if(!dirCover[d] || /cover|folder|front/i.test(im.name)) dirCover[d]=im; });
  const groups=new Map();
  for(let k=0;k<files.length;k++){
    const f=files[k]; toast(`Reading ${k+1} of ${files.length} · ${f.name}`);
    const t=await readTags(f);
    const albumName=(t.album||'').trim() || dirOf(f).split('/').pop() || 'Singles';
    const artist=(t.albumartist||t.artist||'').trim() || 'Unknown artist';
    const key=albumName.toLowerCase();
    if(!groups.has(key)) groups.set(key,{kind:'cd',title:albumName,artist,year:(t.year||'').toString().slice(0,4),tracks:[],coverBlob:null,ext:(f.name.split('.').pop()||'').toUpperCase()});
    const g=groups.get(key);
    if(!g.coverBlob && t.picture && t.picture.data){ g.coverBlob=new Blob([new Uint8Array(t.picture.data)],{type:t.picture.format||'image/jpeg'}); }
    if(!g.coverBlob && dirCover[dirOf(f)]) g.coverBlob=dirCover[dirOf(f)];
    if(!g.year && t.year) g.year=String(t.year).slice(0,4);
    const n=parseInt(String(t.track||'').split('/')[0])||999;
    g.tracks.push([ (t.title||'').trim() || f.name.replace(AUDIO_RE,''), await readDuration(f), f, n ]);
  }
  const fresh=[...groups.values()].map(g=>{ g.tracks.sort((x,y)=>x[3]-y[3]||x[0].localeCompare(y[0])); return g; });
  const kinds=['cd','vinyl','tape'];
  const existing=ALBUMS[0]&&ALBUMS[0].user?ALBUMS:[];
  // add tracks to an album already on the shelf, or add the album
  for(const g of fresh){
    const same=existing.find(a=>a.title.toLowerCase()===g.title.toLowerCase());
    if(same){ const have=new Set(same.tracks.map(t=>t[0])); g.tracks.forEach(t=>{ if(!have.has(t[0])) same.tracks.push(t); }); if(!same.cover&&g.coverBlob){ same.coverBlob=g.coverBlob; same.cover=await blobToBitmap(g.coverBlob); } decorate(same); }
    else { g.kind=kinds[(existing.length)%3]; g.cover=g.coverBlob?await blobToBitmap(g.coverBlob):null; existing.push(decorate(g)); }
  }
  toast('Putting it on the shelf…');
  await buildShelf(existing.slice());
  const withArt=existing.filter(a=>a.cover).length;
  const saved=await saveLibrary();
  const tip = (files.length===1 && matchMedia('(pointer:coarse)').matches) ? ' · Tip: long-press a song in the picker, then tap the others to add many at once' : '';
  toast(`${existing.length} album${existing.length===1?'':'s'} on your shelf · ${withArt} with cover art${saved?'':' · not saved, this browser has no room'}${tip}`, tip?8000:4500);
  $('clearBtn').hidden=false;
}

async function filesFromDrop(dt){
  const entries=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length) return [...dt.files];
  const out=[];
  async function walk(en,path){
    if(en.isFile){ const f=await new Promise(r=>en.file(r,()=>r(null))); if(f){ try{ f._path=path+f.name; }catch(e){} out.push(f); } }
    else if(en.isDirectory){ const rd=en.createReader(); let batch; do{ batch=await new Promise(r=>rd.readEntries(r,()=>r([]))); for(const b of batch) await walk(b,path+en.name+'/'); }while(batch.length); }

}

  if(down.mode==='spin'){ const it=items[act]; const s=screenOf(it); down.cx=s.x; down.cy=s.y; down.lastAng=Math.atan2(e.clientY-s.y,e.clientX-s.x);
    Object.assign(ringEl.style,{width:s.r*2.3+'px',height:s.r*2.3+'px',transform:`translate(${s.x-s.r*1.15}px,${s.y-s.r*1.15}px)`}); ringEl.classList.add('show'); }

addEventListener('wheel',e=>{ if(mode!=='shelf') return; e.preventDefault();
  const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;
  target=THREE.MathUtils.clamp(target+d*0.0028,0,N-1); clearTimeout(snapT); snapT=setTimeout(()=>target=Math.round(target),160); },{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='Escape') return leave();
  if(mode==='shelf'){ if(e.key==='ArrowRight') go(Math.round(target)+1); if(e.key==='ArrowLeft') go(Math.round(target)-1); if(e.key==='Enter' && e.target===document.body) enter(Math.round(cur)); }
  else { if(e.key===' '){ e.preventDefault(); setPlaying(!playing); } if(e.key==='ArrowRight') setTrack(track+1); if(e.key==='ArrowLeft') setTrack(track-1); }
});

/* ---------------- loop ---------------- */
const clock=new THREE.Clock(); let lcdAcc=0;
const tmpE=new THREE.Euler();
function lerpPose(o,p,r,s,k){ o.position.lerp(p,k); o.rotation.x+=(r.x-o.rotation.x)*k; o.rotation.y+=(r.y-o.rotation.y)*k; o.rotation.z+=(r.z-o.rotation.z)*k; const ns=o.scale.x+(s-o.scale.x)*k; o.scale.setScalar(ns); }
function tick(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  cur+=(target-cur)*Math.min(1,dt*7);
  if(mode==='shelf') updateInfo(THREE.MathUtils.clamp(Math.round(cur),0,N-1));
  const k=Math.min(1,dt*6);
  const playerShown = mode==='stage' && ALBUMS[playIdx].kind==='cd';
  const PS = wide?1:0.82;
  const playerPos=new THREE.Vector3(stageX, playerShown?-0.05:-7, 0);
  lerpPose(player.root,playerPos,{x:-0.04,y:wide?0.12:0,z:0},PS,Math.min(1,dt*4.5));

  items.forEach((it,i)=>{
    const d=i-cur, ad=Math.abs(d), sg=Math.sign(d);
    const p=new THREE.Vector3(), r={x:0,y:0,z:0}; let s;
    if(mode==='stage' && i===playIdx){
      if(it.a.kind==='cd'){
        p.set(stageX, -0.05+0.38*PS, 0.19*PS+0.02); s=1.13*PS; r.x=-0.04; r.y=wide?0.12:0;
        // follow the player as it rises
        p.y = player.root.position.y + 0.38*PS; p.x=player.root.position.x;
      } else { p.set(stageX,0.12,1.4); s=(it.a.kind==='tape'?1.45:1.25)*(wide?1:0.86); r.x=-0.08; r.y=wide?0.18:0; }
    } else {
      const x = sg*(Math.min(ad,1)*2.45 + Math.max(ad-1,0)*2.05);
      p.set(x, (mode==='stage'?-10:0), -Math.min(ad,2.2)*0.95);
      r.y = -THREE.MathUtils.clamp(d,-1.6,1.6)*0.5; r.x = -0.06; r.z = THREE.MathUtils.clamp(d,-1,1)*0.04;
      s = 1.18 - Math.min(ad,1)*0.38;
    }
    lerpPose(it.outer,p,r,s,(mode==='stage'&&i===playIdx&&it.a.kind==='cd')?Math.min(1,dt*5):k);

    // spinning
    const isPlaying = mode==='stage' && i===playIdx && playing;
    const dragging = down && down.mode==='spin' && i===Math.round(cur);
    if(!dragging){ it.spinVel*=Math.pow(0.06,dt); it.spinAngle+=it.spinVel*dt*60; }
    if(it.spinAxis==='z'){
      const idle = (mode==='shelf' && ad<.5) ? 0.15*dt : 0;
      // vinyl turns slowly so the label stays readable; speed eases in and out like a real platter
      const want = isPlaying ? (it.a.kind==='cd'?9:1.1) : 0;
      it.playSpeed = (it.playSpeed||0) + (want-(it.playSpeed||0))*Math.min(1,dt*(want?1.2:2.2));
      const play = it.playSpeed*dt;
      it.spinAngle -= idle + play;
      it.spinObj.rotation.z = it.spinAngle;
    } else {
      if(!dragging && Math.abs(it.spinVel)<0.01){ const tgt=Math.round(it.spinAngle/(Math.PI*2))*Math.PI*2; it.spinAngle+=(tgt-it.spinAngle)*Math.min(1,dt*4); }
      it.spinObj.rotation.y = it.spinAngle;
      if(it.reels){ const sp = isPlaying?4*dt:0; it.reels.forEach(rl=>rl.rotation.z-=sp); }
    }
    if(it.a.kind==='vinyl'){
      const out = mode==='stage' && i===playIdx;
      const hover = mode==='shelf' && ad<.5;
      it.rec.position.x += ((out?0.62:hover?0.42:0.3)-it.rec.position.x)*k;
      it.rec.position.z += ((out?0.12:-0.03)-it.rec.position.z)*k;
      it.sleeve.position.x += ((out?-0.62:0)-it.sleeve.position.x)*k;
      it.sleeve.position.z += ((out?-0.2:0)-it.sleeve.position.z)*k;
      it.sleeve.rotation.y += ((out?0.35:0)-it.sleeve.rotation.y)*k;
    }
  });

  if(mode==='stage'){
    const user=ALBUMS[playIdx].user, L=trackLen();
    if(user) elapsed=media.currentTime||0;
    else if(playing){ elapsed+=dt; if(elapsed>=L) setTrack(track+1); }
    $('pBar').style.width=(L?Math.min(100,elapsed/L*100):0)+'%'; $('pTime').textContent=fmtTime(elapsed); }
  lcdAcc+=dt; if(lcdAcc>.06 && playerShown){ lcdAcc=0; drawLCD(t); }

  camera.position.lerp(camPos,k); camTarget.lerp(camAim,k); camera.lookAt(camTarget);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
const mine=await loadLibrary().catch(()=>null);
await buildShelf(mine||DEMO, true);
if(mine){ $('clearBtn').hidden=false; }
ldTarget=100;
tick();
</script>
